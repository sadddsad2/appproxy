name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Generate localization
      run: |
        # 检查是否有国际化配置
        if [ -f "l10n.yaml" ]; then
          echo "Found l10n.yaml, generating localization files..."
          flutter gen-l10n
        elif grep -q "generate: true" pubspec.yaml; then
          echo "Found generate: true in pubspec.yaml"
          # 创建默认的 l10n.yaml
          cat > l10n.yaml << 'ENDOFL10N'
arb-dir: lib/l10n
template-arb-file: intl_en.arb
output-localization-file: l10n.dart
synthetic-package: false
ENDOFL10N
          
          # 创建默认的 arb 文件
          mkdir -p lib/l10n
          cat > lib/l10n/intl_en.arb << 'ENDOFARB'
{
  "@@locale": "en",
  "appTitle": "AppProxy"
}
ENDOFARB
          
          flutter gen-l10n
        else
          echo "No localization config found, skipping..."
        fi
      
    - name: Create keystore
      run: |
        mkdir -p android/app/keystore
        
        if [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
          KEY_PASS=$(openssl rand -base64 32 | tr -d "=+/" | cut -c1-25)
          STORE_PASS=$(openssl rand -base64 32 | tr -d "=+/" | cut -c1-25)
          
          echo "IMPORTANT: Save these passwords!"
          echo "KEY_PASSWORD=$KEY_PASS"
          echo "KEYSTORE_PASSWORD=$STORE_PASS"
        else
          KEY_PASS="${{ secrets.KEY_PASSWORD }}"
          STORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
        fi
        
        keytool -genkey -v \
          -keystore android/app/keystore/release.jks \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -alias release \
          -storepass "$STORE_PASS" \
          -keypass "$KEY_PASS" \
          -dname "CN=AppProxy, OU=Dev, O=YS1231, L=Tokyo, S=Tokyo, C=JP"
        
        echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
        echo "KEYSTORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
        
        mkdir -p output
        echo "KEY_PASSWORD: $KEY_PASS" > output/keystore-info.txt
        echo "KEYSTORE_PASSWORD: $STORE_PASS" >> output/keystore-info.txt
      
    - name: Configure signing
      run: |
        sed -i '/def keystore = localProperties.getProperty/,/}/d' android/app/build.gradle
        sed -i 's|storeFile file(keystore)|storeFile file("keystore/release.jks")|g' android/app/build.gradle
        
    - name: Build APK
      run: flutter build apk --release --split-per-abi
        
    - name: Prepare output
      run: |
        VERSION=$(grep "version:" pubspec.yaml | sed 's/version: //' | tr -d ' ')
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        
        mkdir -p output
        
        for file in build/app/outputs/flutter-apk/*.apk; do
          if [ -f "$file" ]; then
            filename=$(basename "$file")
            if [[ $filename == *"arm64-v8a"* ]]; then
              cp "$file" "output/appproxy-v${VERSION}-arm64-v8a.apk"
            elif [[ $filename == *"armeabi-v7a"* ]]; then
              cp "$file" "output/appproxy-v${VERSION}-armeabi-v7a.apk"
            elif [[ $filename == *"x86_64"* ]]; then
              cp "$file" "output/appproxy-v${VERSION}-x86_64.apk"
            fi
          fi
        done
        
        cd output
        for file in *.apk; do
          [ -f "$file" ] && sha256sum "$file" > "$file.sha256"
        done
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk-files
        path: output/*.apk
        
    - name: Upload keystore
      uses: actions/upload-artifact@v4
      with:
        name: keystore
        path: |
          android/app/keystore/release.jks
          output/keystore-info.txt
        
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: output/*
        body: |
          ## AppProxy ${{ env.VERSION }}
          
          **Download:**
          - arm64-v8a: Modern phones (recommended)
          - armeabi-v7a: Older devices
          - x86_64: Emulators
          
          **Verify:**
          ```bash
          sha256sum -c appproxy-*.apk.sha256
          ```
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
