name: Build and Release APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        
    - name: Get Flutter dependencies
      run: flutter pub get
      
    - name: Generate signing keystore
      run: |
        # 创建密钥存储目录
        mkdir -p android/app/keystore
        
        # 生成随机密码（如果没有在 Secrets 中设置）
        if [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
          KEY_PASSWORD=$(openssl rand -base64 32 | tr -d "=+/" | cut -c1-25)
          KEYSTORE_PASSWORD=$(openssl rand -base64 32 | tr -d "=+/" | cut -c1-25)
          
          echo "🔐 生成新密码..."
          
          # 使用 GitHub CLI 设置 Secrets
          echo "$KEY_PASSWORD" | gh secret set KEY_PASSWORD
          echo "$KEYSTORE_PASSWORD" | gh secret set KEYSTORE_PASSWORD
          
          echo "✅ 密码已自动保存到 GitHub Secrets"
        else
          KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
          KEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}"
          
          echo "✅ 使用已保存的密码"
        fi
        
        # 生成密钥库
        keytool -genkey -v \
          -keystore android/app/keystore/release.jks \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -alias release \
          -storepass "$KEYSTORE_PASSWORD" \
          -keypass "$KEY_PASSWORD" \
          -dname "CN=AppProxy, OU=Development, O=YS1231, L=Tokyo, S=Tokyo, C=JP"
        
        echo "✅ Keystore generated successfully"
        echo "KEY_ALIAS=release" >> $GITHUB_ENV
        echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
        echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
        
        # 保存密码信息到文件（备份用）
        mkdir -p output
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━" > output/KEYSTORE_INFO.txt
        echo "AppProxy Release Keystore Information" >> output/KEYSTORE_INFO.txt
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━" >> output/KEYSTORE_INFO.txt
        echo "" >> output/KEYSTORE_INFO.txt
        echo "✅ 密码已自动保存到 GitHub Secrets" >> output/KEYSTORE_INFO.txt
        echo "" >> output/KEYSTORE_INFO.txt
        echo "Keystore File: release.jks" >> output/KEYSTORE_INFO.txt
        echo "KEY_ALIAS: release" >> output/KEYSTORE_INFO.txt
        echo "KEY_PASSWORD: $KEY_PASSWORD" >> output/KEYSTORE_INFO.txt
        echo "KEYSTORE_PASSWORD: $KEYSTORE_PASSWORD" >> output/KEYSTORE_INFO.txt
        echo "" >> output/KEYSTORE_INFO.txt
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━" >> output/KEYSTORE_INFO.txt
        echo "注意事项:" >> output/KEYSTORE_INFO.txt
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━" >> output/KEYSTORE_INFO.txt
        echo "" >> output/KEYSTORE_INFO.txt
        echo "1. ✅ 密码已自动保存到仓库的 Secrets" >> output/KEYSTORE_INFO.txt
        echo "2. 💾 请下载 release.jks 文件并妥善保管" >> output/KEYSTORE_INFO.txt
        echo "3. 📝 此信息文件仅作备份参考" >> output/KEYSTORE_INFO.txt
        echo "" >> output/KEYSTORE_INFO.txt
        echo "如需查看 Secrets:" >> output/KEYSTORE_INFO.txt
        echo "Settings -> Secrets and variables -> Actions" >> output/KEYSTORE_INFO.txt
        echo "" >> output/KEYSTORE_INFO.txt
        echo "后续构建会自动使用已保存的密码。" >> output/KEYSTORE_INFO.txt
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━" >> output/KEYSTORE_INFO.txt
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Modify build.gradle to remove local.properties dependency
      run: |
        cp android/app/build.gradle android/app/build.gradle.bak
        sed -i '/def keystore = localProperties.getProperty/,/}/d' android/app/build.gradle
        sed -i 's|storeFile file(keystore)|storeFile file("keystore/release.jks")|g' android/app/build.gradle
        sed -i 's|keyAlias System.getenv("KEY_ALIAS")|keyAlias System.getenv("KEY_ALIAS")|g' android/app/build.gradle
        sed -i 's|keyPassword System.getenv("KEY_PASSWORD")|keyPassword System.getenv("KEY_PASSWORD")|g' android/app/build.gradle
        sed -i 's|storePassword System.getenv("KEYSTORE_PASSWORD")|storePassword System.getenv("KEYSTORE_PASSWORD")|g' android/app/build.gradle
        echo "✅ build.gradle modified successfully"
        
    - name: Build APK (Release)
      run: |
        flutter build apk --release --split-per-abi
        
    - name: Rename APK files
      run: |
        # 获取版本号
        VERSION=$(grep "version:" pubspec.yaml | sed 's/version: //' | tr -d ' ')
        
        # 创建输出目录
        mkdir -p output
        
        # 重命名文件
        for file in build/app/outputs/flutter-apk/*.apk; do
          if [ -f "$file" ]; then
            filename=$(basename "$file")
            if [[ $filename == *"arm64-v8a"* ]]; then
              cp "$file" "output/appproxy-v${VERSION}-arm64-v8a-release.apk"
            elif [[ $filename == *"armeabi-v7a"* ]]; then
              cp "$file" "output/appproxy-v${VERSION}-armeabi-v7a-release.apk"
            elif [[ $filename == *"x86_64"* ]]; then
              cp "$file" "output/appproxy-v${VERSION}-x86_64-release.apk"
            else
              cp "$file" "output/appproxy-v${VERSION}-universal-release.apk"
            fi
          fi
        done
        
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        
    - name: Generate SHA256 checksums
      run: |
        cd output
        for file in *.apk; do
          sha256sum "$file" > "$file.sha256"
        done
        cd ..
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: apk-files
        path: output/*.apk
        retention-days: 30
        
    - name: Upload checksums
      uses: actions/upload-artifact@v4
      with:
        name: checksums
        path: output/*.sha256
        retention-days: 30
        
    - name: Save keystore (first time only)
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: actions/upload-artifact@v4
      with:
        name: release-keystore
        path: android/app/keystore/release.jks
        retention-days: 90
        
    - name: Upload keystore info
      uses: actions/upload-artifact@v4
      with:
        name: keystore-info
        path: output/KEYSTORE_INFO.txt
        retention-days: 90
        
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          output/*.apk
          output/*.sha256
        body: |
          ## AppProxy ${{ env.VERSION }}
          
          ### 下载说明
          - `arm64-v8a`: 适用于 64位 ARM 设备（推荐，大部分现代手机）
          - `armeabi-v7a`: 适用于 32位 ARM 设备（旧设备）
          - `x86_64`: 适用于 64位 x86 设备（模拟器）
          - `universal`: 通用版本（包含所有架构，体积较大）
          
          ### SHA256 校验
          每个 APK 都附带 `.sha256` 文件，可用于验证完整性。
          
          ### 自动构建信息
          - 构建时间: ${{ github.event.head_commit.timestamp }}
          - 提交信息: ${{ github.event.head_commit.message }}
          - 提交者: ${{ github.event.head_commit.author.name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Send build notification
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ 构建成功！"
          echo "📦 APK 文件已生成"
          echo "🔑 签名密钥已保存（请在 Actions artifacts 中下载备份）"
        else
          echo "❌ 构建失败"
        fi
