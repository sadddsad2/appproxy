name: Build and Release APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        
    - name: Get Flutter dependencies
      run: flutter pub get
      
    - name: Generate localization files
      run: |
        # 检查是否有国际化配置
        if [ -f "l10n.yaml" ] || grep -q "generate: true" pubspec.yaml; then
          echo "📝 生成国际化文件..."
          flutter gen-l10n || echo "⚠️  国际化生成失败，继续构建"
        else
          echo "ℹ️  未检测到国际化配置，跳过"
        fi
      
    - name: Generate signing keystore
      run: |
        # 创建密钥存储目录
        mkdir -p android/app/keystore
        
        # 生成随机密码（如果没有在 Secrets 中设置）
        if [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
          KEY_PASSWORD=$(openssl rand -base64 32 | tr -d "=+/" | cut -c1-25)
          KEYSTORE_PASSWORD=$(openssl rand -base64 32 | tr -d "=+/" | cut -c1-25)
          
          echo "🔐 首次运行 - 生成新密码"
          echo ""
          echo "⚠️  重要: 请保存以下密码并手动添加到 GitHub Secrets!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "KEY_PASSWORD=$KEY_PASSWORD"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "📝 添加步骤:"
          echo "1. 进入仓库 Settings -> Secrets and variables -> Actions"
          echo "2. 点击 New repository secret"
          echo "3. 添加 KEY_PASSWORD (值见上方)"
          echo "4. 添加 KEYSTORE_PASSWORD (值见上方)"
          echo ""
          echo "💡 提示: 密码信息也会保存在 Artifacts 中供下载"
          echo ""
        else
          KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
          KEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}"
          
          echo "✅ 使用已保存的密码"
        fi
        
        # 生成密钥库
        keytool -genkey -v \
          -keystore android/app/keystore/release.jks \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -alias release \
          -storepass "$KEYSTORE_PASSWORD" \
          -keypass "$KEY_PASSWORD" \
          -dname "CN=AppProxy, OU=Development, O=YS1231, L=Tokyo, S=Tokyo, C=JP"
        
        echo "✅ Keystore generated successfully"
        echo "KEY_ALIAS=release" >> $GITHUB_ENV
        echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
        echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
        
        # 保存密码信息到文件（备份用）
        mkdir -p output
        cat > output/KEYSTORE_INFO.txt <<EOF
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
AppProxy Release Keystore Information
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

⚠️  请妥善保管此文件和 keystore 文件！

Keystore File: release.jks
KEY_ALIAS: release
KEY_PASSWORD: $KEY_PASSWORD
KEYSTORE_PASSWORD: $KEYSTORE_PASSWORD

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
如何添加到 GitHub Secrets:
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

1. 进入仓库的 Settings
2. 点击 Secrets and variables -> Actions
3. 点击 New repository secret
4. 添加以下 secrets:
   - Name: KEY_PASSWORD
     Value: $KEY_PASSWORD

   - Name: KEYSTORE_PASSWORD
     Value: $KEYSTORE_PASSWORD

5. 将 release.jks 文件保存到安全位置

后续构建时，workflow 会从 Secrets 读取这些密码。
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
EOF
      
    - name: Modify build.gradle to use environment variables
      run: |
        # 备份原文件
        cp android/app/build.gradle android/app/build.gradle.bak
        
        # 移除 local.properties 相关代码
        sed -i '/def keystore = localProperties.getProperty/,/}/d' android/app/build.gradle
        
        # 修改签名配置使用环境变量
        sed -i 's|storeFile file(keystore)|storeFile file("keystore/release.jks")|g' android/app/build.gradle
        
        echo "✅ build.gradle modified successfully"
        
    - name: Build APK (Release)
      run: |
        echo "🔨 开始构建 APK..."
        flutter build apk --release --split-per-abi
        echo "✅ APK 构建完成"
        
    - name: Rename APK files
      run: |
        # 获取版本号
        VERSION=$(grep "version:" pubspec.yaml | sed 's/version: //' | tr -d ' ')
        
        # 创建输出目录
        mkdir -p output
        
        echo "📦 重命名 APK 文件 (版本: $VERSION)..."
        
        # 重命名文件
        for file in build/app/outputs/flutter-apk/*.apk; do
          if [ -f "$file" ]; then
            filename=$(basename "$file")
            if [[ $filename == *"arm64-v8a"* ]]; then
              cp "$file" "output/appproxy-v${VERSION}-arm64-v8a-release.apk"
              echo "  ✓ arm64-v8a"
            elif [[ $filename == *"armeabi-v7a"* ]]; then
              cp "$file" "output/appproxy-v${VERSION}-armeabi-v7a-release.apk"
              echo "  ✓ armeabi-v7a"
            elif [[ $filename == *"x86_64"* ]]; then
              cp "$file" "output/appproxy-v${VERSION}-x86_64-release.apk"
              echo "  ✓ x86_64"
            else
              cp "$file" "output/appproxy-v${VERSION}-universal-release.apk"
              echo "  ✓ universal"
            fi
          fi
        done
        
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        
    - name: Generate SHA256 checksums
      run: |
        echo "🔐 生成 SHA256 校验和..."
        cd output
        for file in *.apk; do
          if [ -f "$file" ]; then
            sha256sum "$file" > "$file.sha256"
            echo "  ✓ $file.sha256"
          fi
        done
        cd ..
        
    - name: List output files
      run: |
        echo "📋 输出文件列表:"
        ls -lh output/
        
    - name: Upload APK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: apk-files
        path: output/*.apk
        retention-days: 30
        
    - name: Upload checksums
      uses: actions/upload-artifact@v4
      with:
        name: checksums
        path: output/*.sha256
        retention-days: 30
        
    - name: Upload keystore (first time)
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: actions/upload-artifact@v4
      with:
        name: release-keystore
        path: android/app/keystore/release.jks
        retention-days: 90
        
    - name: Upload keystore info
      uses: actions/upload-artifact@v4
      with:
        name: keystore-info
        path: output/KEYSTORE_INFO.txt
        retention-days: 90
        
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          output/*.apk
          output/*.sha256
        body: |
          ## 🎉 AppProxy ${{ env.VERSION }}
          
          ### 📱 下载说明
          
          | 架构 | 适用设备 | 推荐度 |
          |------|---------|--------|
          | **arm64-v8a** | 64位 ARM 设备 | ⭐⭐⭐⭐⭐ 推荐 |
          | armeabi-v7a | 32位 ARM 设备 | ⭐⭐⭐ 旧设备 |
          | x86_64 | 64位 x86 设备 | ⭐⭐ 模拟器 |
          | universal | 通用版本 | ⭐ 体积大 |
          
          > 💡 **不知道选哪个？** 大部分现代手机（2016年后）选择 **arm64-v8a** 版本
          
          ### 🔐 安全校验
          
          每个 APK 都附带 `.sha256` 文件用于验证完整性：
          
          ```bash
          # 下载后验证
          sha256sum -c appproxy-v${{ env.VERSION }}-arm64-v8a-release.apk.sha256
          ```
          
          ### 📋 更新内容
          
          ${{ github.event.head_commit.message }}
          
          ### ℹ️ 构建信息
          
          - **构建时间**: ${{ github.event.head_commit.timestamp }}
          - **提交者**: ${{ github.event.head_commit.author.name }}
          - **Commit**: `${{ github.sha }}`
          
          ---
          
          ### 🚀 快速开始
          
          1. 根据设备选择对应的 APK 下载
          2. 安装到 Android 设备
          3. 授予 VPN 权限
          4. 添加 Workers 配置
          5. 选择需要代理的应用
          6. 启动 VPN
          
          ### 📖 完整文档
          
          查看 [README.md](https://github.com/${{ github.repository }}) 了解详细使用说明。
          
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Build Summary
      if: always()
      run: |
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "           构建结果汇总"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        
        if [ "${{ job.status }}" == "success" ]; then
          echo ""
          echo "✅ 构建成功！"
          echo ""
          echo "📦 生成的文件:"
          ls -1 output/*.apk 2>/dev/null || echo "  未找到 APK 文件"
          echo ""
          echo "🔑 签名密钥信息:"
          echo "  - 密钥文件已保存到 Artifacts"
          echo "  - 密钥信息已保存到 KEYSTORE_INFO.txt"
          echo ""
          echo "📥 下载方式:"
          echo "  1. Actions 页面 -> 选择此次运行"
          echo "  2. 滚动到底部 Artifacts 区域"
          echo "  3. 下载 apk-files.zip"
          echo ""
          if [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "⚠️  重要提醒:"
            echo "  首次构建已生成密钥！"
            echo "  请立即下载 keystore-info 并添加密码到 Secrets"
            echo "  否则下次构建会生成新的密钥，导致签名不一致！"
          fi
          echo ""
        else
          echo ""
          echo "❌ 构建失败"
          echo ""
          echo "请检查构建日志查看详细错误信息"
          echo ""
        fi
        
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
