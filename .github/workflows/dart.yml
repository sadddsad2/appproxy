name: Build and Release APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        
    - name: Get Flutter dependencies
      run: flutter pub get
      
    - name: Generate signing keystore
      run: |
        # 创建密钥存储目录
        mkdir -p android/app/keystore
        
        # 生成随机密码（如果没有在 Secrets 中设置）
        if [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
          KEY_PASSWORD=$(openssl rand -base64 32 | tr -d "=+/" | cut -c1-25)
          KEYSTORE_PASSWORD=$(openssl rand -base64 32 | tr -d "=+/" | cut -c1-25)
        else
          KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
          KEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}"
        fi
        
        # 保存密码信息到文件
        mkdir -p output
        cat > output/KEYSTORE_INFO.txt <<EOFINFO
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
AppProxy Release Keystore Information
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

⚠️  请妥善保管此文件和 keystore 文件！

Keystore File: release.jks
KEY_ALIAS: release
KEY_PASSWORD: $KEY_PASSWORD
KEYSTORE_PASSWORD: $KEYSTORE_PASSWORD

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
如何添加到 GitHub Secrets:
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

1. 进入仓库的 Settings
2. 点击 Secrets and variables -> Actions
3. 点击 New repository secret
4. 添加以下 secrets:
   - Name: KEY_PASSWORD
     Value: $KEY_PASSWORD
   
   - Name: KEYSTORE_PASSWORD
     Value: $KEYSTORE_PASSWORD

5. 将 release.jks 文件保存到安全位置

后续构建时，workflow 会从 Secrets 读取这些密码。
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
EOFINFO
        
        # 生成密钥库
        keytool -genkey -v \
          -keystore android/app/keystore/release.jks \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -alias release \
          -storepass "$KEYSTORE_PASSWORD" \
          -keypass "$KEY_PASSWORD" \
          -dname "CN=AppProxy, OU=Development, O=YS1231, L=Tokyo, S=Tokyo, C=JP"
        
        echo "✅ Keystore generated successfully"
        echo "KEY_ALIAS=release" >> $GITHUB_ENV
        echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
        echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
        
        # 显示生成的密码（仅在首次运行时）
        if [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
          echo ""
          echo "⚠️  首次构建 - 请保存以下密码信息！"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔑 KEY_ALIAS=release"
          echo "🔑 KEY_PASSWORD=$KEY_PASSWORD"
          echo "🔑 KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "📝 请将以上密码添加到 GitHub Secrets："
          echo "   Settings -> Secrets and variables -> Actions -> New repository secret"
          echo ""
          echo "💾 请从 Artifacts 下载 release-keystore 并妥善保管"
          echo ""
        fi
        
    - name: Create local.properties with keystore path
      run: |
        # 创建或更新 local.properties
        cat > android/local.properties <<EOF
sdk.dir=$ANDROID_HOME
flutter.sdk=$FLUTTER_ROOT
flutter.versionCode=1
flutter.versionName=1.0.0
flutter.keystore=app/keystore/release.jks
flutter.ndkVersion=29.0.13113456
EOF
        
        echo "📝 Created local.properties:"
        cat android/local.properties
        
    - name: Update build.gradle for signing
      run: |
        echo "✅ build.gradle already has signing configuration"
        echo "📝 Current signingConfigs in build.gradle:"
        sed -n '/signingConfigs {/,/^    }/p' android/app/build.gradle
        
    - name: Verify signing configuration
      run: |
        echo "🔍 Checking local.properties:"
        cat android/local.properties
        echo ""
        echo "🔍 Checking keystore file:"
        ls -la android/app/keystore/
        echo ""
        echo "🔍 Checking environment variables:"
        echo "KEY_ALIAS is set: $([ -n "$KEY_ALIAS" ] && echo 'yes' || echo 'no')"
        echo "KEY_PASSWORD is set: $([ -n "$KEY_PASSWORD" ] && echo 'yes' || echo 'no')"
        echo "KEYSTORE_PASSWORD is set: $([ -n "$KEYSTORE_PASSWORD" ] && echo 'yes' || echo 'no')"
        
    - name: Build APK (Release)
      run: |
        flutter build apk --release --split-per-abi
        
    - name: Rename APK files
      run: |
        # 获取版本号
        VERSION=$(grep "version:" pubspec.yaml | sed 's/version: //' | tr -d ' ')
        
        # 创建输出目录
        mkdir -p output
        
        # 重命名文件
        for file in build/app/outputs/flutter-apk/*.apk; do
          if [ -f "$file" ]; then
            filename=$(basename "$file")
            if [[ $filename == *"arm64-v8a"* ]]; then
              cp "$file" "output/appproxy-v${VERSION}-arm64-v8a-release.apk"
            elif [[ $filename == *"armeabi-v7a"* ]]; then
              cp "$file" "output/appproxy-v${VERSION}-armeabi-v7a-release.apk"
            elif [[ $filename == *"x86_64"* ]]; then
              cp "$file" "output/appproxy-v${VERSION}-x86_64-release.apk"
            else
              cp "$file" "output/appproxy-v${VERSION}-universal-release.apk"
            fi
          fi
        done
        
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        
    - name: Generate SHA256 checksums
      run: |
        cd output
        for file in *.apk; do
          sha256sum "$file" > "$file.sha256"
        done
        cd ..
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: apk-files
        path: output/*.apk
        retention-days: 30
        
    - name: Upload checksums
      uses: actions/upload-artifact@v4
      with:
        name: checksums
        path: output/*.sha256
        retention-days: 30
        
    - name: Save keystore (first time only)
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: actions/upload-artifact@v4
      with:
        name: release-keystore
        path: android/app/keystore/release.jks
        retention-days: 90
        
    - name: Upload keystore info
      uses: actions/upload-artifact@v4
      with:
        name: keystore-info
        path: output/KEYSTORE_INFO.txt
        retention-days: 90
        
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          output/*.apk
          output/*.sha256
        body: |
          ## AppProxy ${{ env.VERSION }}
          
          ### 下载说明
          - `arm64-v8a`: 适用于 64位 ARM 设备（推荐，大部分现代手机）
          - `armeabi-v7a`: 适用于 32位 ARM 设备（旧设备）
          - `x86_64`: 适用于 64位 x86 设备（模拟器）
          - `universal`: 通用版本（包含所有架构，体积较大）
          
          ### SHA256 校验
          每个 APK 都附带 `.sha256` 文件，可用于验证完整性。
          
          ### 自动构建信息
          - 构建时间: ${{ github.event.head_commit.timestamp }}
          - 提交信息: ${{ github.event.head_commit.message }}
          - 提交者: ${{ github.event.head_commit.author.name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Send build notification
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ 构建成功！"
          echo "📦 APK 文件已生成"
          echo "🔑 签名密钥已保存（请在 Actions artifacts 中下载备份）"
        else
          echo "❌ 构建失败"
        fi
